# wireplumber-90-sj201-profile.conf — WirePlumber pro-audio profile for SJ201
#
# Forces the SJ201 sound card into "pro-audio" mode so WirePlumber exposes
# both the I2S playback (hw:sj201,0) and XVF3510 capture (hw:sj201,1) nodes
# directly, without USB/HDMI auto-profile switching getting in the way.
#
# BACKGROUND:
# Previously this config included workarounds for XVF3510 DSP silence. Those
# are no longer needed — the real fix was setting MCLK=12.288MHz in
# mark2-audio-init.service before SPI flash. See docs/XVF3510_HARDWARE.md.
#
# After WirePlumber starts (post mark2-audio-init), the PipeWire node names are:
#   Playback : 'alsa_output.hw:sj201,0'          → TAS5806 amplifier
#   Capture  : 'Built-in Audio (bcm2835-i2s-dir-hifi dir-hifi-1)' → XVF3510 mic
#
# LVA configuration:
#   --audio-input-device  'Built-in Audio (bcm2835-i2s-dir-hifi dir-hifi-1)'
#   --audio-output-device 'pipewire/alsa_output.hw:sj201,0'
#
# Install to: ~/.config/wireplumber/wireplumber.conf.d/90-sj201-profile.conf

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*soc_sound*" }
      { device.name = "alsa_card.platform-soc_sound" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        api.acp.auto-profile = false
        api.acp.auto-port    = false
        device.profile       = "pro-audio"
        api.alsa.split-enable = false
      }
    }
  }
]
