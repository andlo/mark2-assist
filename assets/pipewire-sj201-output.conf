# pipewire-sj201-output.conf — PipeWire virtual sink for SJ201 speaker output
#
# Creates a named PipeWire audio sink that writes to ALSA plughw:CARD=sj201,DEV=0
# — the Pi I2S output to XMOS XVF3510 → TAS5806 amplifier → speaker.
#
# WHY THIS IS NEEDED:
# PipeWire's virtual sink owns the ALSA device and multiplexes through its
# internal graph — mic capture and speaker output coexist without conflicting
# at the ALSA level. Direct ALSA playback while capture is open causes issues.
#
# Additionally, python-mpv's end-file callback is unreliable with the generic
# 'pipewire' or 'pulse' devices on aarch64/Python 3.13. Using a named sink
# ('pipewire/sj201-output' or 'pipewire/alsa_output.hw:sj201,0') gives
# reliable callbacks.
#
# Install to: ~/.config/pipewire/pipewire.conf.d/sj201-output.conf
# Reload:     systemctl --user restart pipewire pipewire-pulse wireplumber
# LVA usage:  --audio-output-device 'pipewire/alsa_output.hw:sj201,0'
#             (WirePlumber names it 'alsa_output.hw:sj201,0' automatically)

context.objects = [
  {
    factory = adapter
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = sj201-output
      node.description = "SJ201 Speaker"
      media.class      = Audio/Sink
      api.alsa.path    = "plughw:CARD=sj201,DEV=0"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [FL FR]
    }
  }
]
