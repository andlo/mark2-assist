# wireplumber-91-sj201-disable-acp.conf — EXPERIMENTAL / NOT USED
#
# Disables the entire SJ201 ALSA card from WirePlumber's view.
# This was explored as an alternative approach when WirePlumber was
# suspected of resetting the XVF3510 DSP pipeline.
#
# ROOT CAUSE FOUND (May 2026): The silence was caused by wrong MCLK
# frequency (24.576MHz vs required 12.288MHz), not WirePlumber.
# This file is therefore unnecessary for normal operation.
#
# If you want LVA to access hw:sj201,1 directly (bypassing PipeWire),
# install this file alongside 90-sj201-profile.conf. Then configure LVA
# with --audio-input-device 'hw:CARD=sj201,DEV=1'.
# WARNING: without WirePlumber holding playback, BCLK may stop and
# the XVF3510 will go silent after ~250ms.
#
# See docs/XVF3510_HARDWARE.md for full explanation.

monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-soc_sound" } ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
