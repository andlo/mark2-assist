# pipewire-sj201-asr.conf — DEPRECATED / no longer installed
#
# This file was the old workaround for XVF3510 silence:
# expose hw:sj201,1 as PulseAudio source via module-alsa-source,
# bypassing WirePlumber entirely for the capture side.
#
# ROOT CAUSE FOUND (May 2026): The silence was NOT caused by WirePlumber
# resetting the DSP pipeline. The real cause was sj201.dtbo setting
# MCLK=24.576MHz instead of the required 12.288MHz. With correct MCLK,
# WirePlumber can hold hw:sj201,1 normally and the pipeline runs.
#
# CURRENT APPROACH:
# - mark2-audio-init.service runs setup_mclk+setup_bclk before SPI flash
# - WirePlumber holds hw:sj201,1 via pro-audio profile (wireplumber-90-sj201-profile.conf)
# - LVA uses PipeWire node name: 'Built-in Audio (bcm2835-i2s-dir-hifi dir-hifi-1)'
#
# This file is kept for historical reference. It is NOT copied to the system
# by mark2-satellite-setup.sh.
#
# See docs/XVF3510_HARDWARE.md for full explanation.

# pulse.cmd = [
#   {
#     cmd = load-module
#     args = "module-alsa-source device=hw:sj201,1 rate=48000 channels=2 format=s32le"
#     flags = []
#   }
# ]
